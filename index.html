<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Structural Design Dissimilarity Experiment</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a6c0cc; font-family: sans-serif; }
    /* The canvas fills the window; ImGui's GLFW backend resizes the drawing buffer to match. */
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
              font-size: 20px; color: #222; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">Loading…</div>
  <script>
    var statusEl = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
      setStatus: function (t) { statusEl.textContent = t; if (!t) statusEl.style.display = 'none'; },
      onRuntimeInitialized: function () { statusEl.style.display = 'none'; }
    };
  </script>
  <script async type="text/javascript" src="index.js"></script>
</body>
</html>
